VillageBonus1=The local Priest offers that you do not collect taxes from the village. In exchange, he is ready to cast some kind spell upon your army. This spell will last for a very long time thanks to certain secrets of sorcery.#\#\#\@Do you agree to accept this offer instead of the usual tax collection?
VillageBonus2=The local Priest offers that you do not collect taxes from the village. He sees that the fighters of your army are in need of healing. The Priest is ready to attempt to heal all those he can, as far as his strength allows.#\#\#\@Do you agree to accept this offer instead of the usual tax collection?
VillageBonus3=Several Hunters from this village approach you. They offer that you do not collect taxes from the village. In exchange, they will give you pelts that can be sold at the market for money, much larger than the usual tax amount.
VillageBonus3Ask=#\#\#\@Do you agree to accept this offer instead of the usual tax collection?
VillageBonus3Result=#\#\#\*You agreed. The Hunters give you a bag of pelts.
VillageBonus4=The local Sorceress offers that you do not collect taxes from the village. In exchange, she will perform a ritual that will greatly increase your magic power.
VillageBonus4Ask=#\#\#\@Do you agree to accept this offer instead of the usual tax collection?
VillageBonus4Result=#\#\#\|You have agreed. The Sorceress performed the ritual, and your magic power has increased.
VillageBonus5=A village innkeeper approaches you. He offers that you do not collect taxes from the village. The innkeeper sees that many of your army's fighters have not received their wages for a long time. The innkeeper is ready to provide plenty of food and drink for the fighters - as compensation for their wages - so that all fighters will participate in battles again.
VillageBonus5Ask=#\#\#\@Do you agree to accept this offer instead of the usual tax collection?
VillageBonus5Result=#\#\#\*You agreed. Now your warriors are satisfied and ready to go into battle!
