Bonus1=Long Weapon - on the first turn of battle, the character receives tripled melee defense
Bonus2=Quick Attack - on the first turn of battle, the character gains +1 action
Bonus3=Piercing Strike - the character deals damage, ignoring the enemy's defense, except for defense from buildings
Bonus4=Healing Skill - a squad containing such characters restores 15% health to all wounded warriors every day
Bonus5=Expert Trader - a squad containing such characters receives +5 de50% price when selling an item and -30% price when buying an item
Bonus6=Curse of Death - the forces of Evil instantly take the life of any enemy that kills the character in battle
Bonus7=God's Punishment - the character deals 10 damage in addition to their attack, ignoring any enemy defenses
Bonus8=God's Wrath - the character deals 20 damage in addition to their attack, ignoring any enemy defenses
Bonus9=Invulnerability - from any strike, the character loses only 1 HP
Bonus10=Dark Gift - the forces of Evil allow the character's strike to ignore the enemy's armor, and also absorbs 30% of an enemy's strike
Bonus11=Dark Art - the forces of Evil allow the character's strike to ignore the enemy's armor, absorb 30% of an enemy's strike, and on the first turn of battle, the character gains +1 action
Bonus12=Evasiveness - only 70% of an enemy's physical damage passes through the character's defense
Bonus13=Furious Spirit - the character is invulnerable to physical weapons, and in the event of death, their fury takes the life of their killer
Bonus14=Volley Attack - the character always takes the very first turn in battle, and deals damage, ignoring the enemy's defense
Bonus15=Garrison - while in a castle or fort, the character doubles their combat stats and receives only 70% of enemy physical damage passing through the character's defense
Bonus16=Rear Service - the character reduces the pay of all troops they are part of by 30%
Bonus17=Poisoned Weapon - after any serious strike dealt by such a weapon, the enemy loses 15% health every turn of battle
Bonus18=Deadman - the character is dead, and therefore arrows deal 70% less damage to them
Bonus19=Quick Deadman - the character's dead body reduces ranged attack efficiency by 70%, and on the first turn of battle, the character gains +1 action
Bonus20=Counterattack - the character responds to an enemy's strike with a strike of their own
Bonus21=Flanking Strike - a character striking from the side, through an empty tile, doubles their attack
Bonus22=Hunger - the character restores health upon killing an enemy
Bonus23=Berserker - the lower the character's health, the higher his damage
Bonus24=Exhaustion - this character's magic attacks reduce the enemy's magic immunity by 10% for the entire battle; the effect accumulates
Bonus25=Withering - this character's magic attacks additionally deal 8% damage from the enemy's maximum health, ignoring magic immunity
Bonus26=Poisonous - any character that attacks a bearer of this bonus is poisoned by 15%
Bonus27=Suicide - the character dies after his attack
Bonus28=Sorcery - the character reduces spell casting time and price by 20%
Bonus29=Sweeping Blow - this character's attacks deal 70% damage to the target and an additional 30% damage to the target's neighbors
Bonus30=Fortification - each turn the character gains +20% to physical defense up to +100%
Bonus31=Domination - this character's attacks deal damage to the player's entire field
Bonus32=Strong Poison - after any heavy blow dealt by such weapon, the enemy loses 25% health on each turn of the battle
Bonus33=Concentration - this character's magic power increases during battle
Bonus34=Powerful Magic - this character's magic attacks ignore magic immunity
Bonus35=Stunning Blow - this character's attacks reduce the target's initiative by 35%
Bonus36=First Strike - the character always takes the very first turn in battle
Bonus37=Bastion - while in a castle or fort, the character triples his combat stats, takes only 50% of enemy physical damage that passes through the character's defense, and increases the defense of the entire army by 10
Bonus38=Flying - this character can attack any enemy from any row
Bonus39=Bleeding - this character's attacks inflict 75% bleeding on the enemy; bleeding enemies lose % of health from their attack
Bonus40=Preemptive Strike - before an enemy's blow, the character delivers a counter-strike
Bonus41=Swarm - the character receives a 25% damage bonus if his army is larger than the enemy's army, and -25% damage if his army is smaller than the enemy's
Bonus42=Armor Destruction - attacks of this weapon reduce the target's armor by 25%
Bonus43=Maiming Weapon - characters maimed by such weapons do not heal wounds
Bonus44=Lightning Attack - during the first two turns of battle, the character gains +1 action
Bonus45=Poison Sting - the character deals damage, ignoring enemy defense except for structure defense, and poisons the target by 10%
Bonus46=Hold Formation - characters standing next to each other receive a 25% bonus to damage and defense for each character in the row (does not work)
Bonus47=Neutralization - this character's attacks strip the target of its bonus
Bonus48=Execution - the character instantly kills an enemy with less than 25% health
Bonus49=Bloodlust - if the character kills a target, he regains 1 action
Bonus50=Assault - when assaulting a structure, the character doubles his combat stats and takes only 70% of enemy physical damage that passes through the character's defense
Bonus51=Gift of Eternity - this character's blessings and curses last for the entire battle
Bonus52=Gift of Fate - once per battle, the character survives a lethal attack, restores health, and continues fighting with increased stats
