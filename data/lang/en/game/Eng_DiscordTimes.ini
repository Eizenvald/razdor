Descript1=A participant in many brutal battles, the Knight possesses excellent combat experience. Thanks to the patronage of the church, the Knight is able to withstand hostile magic spells.
Descript2=The Archmage possesses the ability to call upon the mighty forces of the universe, beyond the reach of ordinary people. In battle, the Archmage immobilizes the opponent.
Descript3=The Pathfinder is a fast and accurate Sharpshooter, unsurpassed in navigating the terrain. By spending much time observing nature, the Pathfinder knows the secrets of rapid wound healing.
