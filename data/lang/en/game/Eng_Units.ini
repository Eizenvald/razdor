; English texts for Razdor, made by razdor-translate from the Russian file.

[1 Рыцарь]
Name=Knight
Descript=A participant in many cruel battles, the Knight possesses superb combat experience.

[2 Архимаг]
Name=Archmage
Descript=The Archmage is capable of calling upon the mighty forces of the universe, beyond the reach of ordinary men.

[3 Следопыт]
Name=Pathfinder
Descript=The art of shooting is given to the Pathfinder by God, and knowledge of nature endows him with an unbreakable will to live.

[4 Ополченец]
Name=Militiaman
Descript=A recruit becomes a Militiaman once they are given a spear and taught to march in formation.

[5 Стражник]
Name=Guard
Descript=A warrior who has achieved certain arts in martial matters receives better equipment.

[6 Алебардист]
Name=Halberdier
Descript=Having prospered in military service, the Halberdier has studied all the tricks of his terrible weapon and wields it perfectly.

[7 Гвардеец]
Name=Guardsman
Descript=A warrior, having gained fame for his martial skill, has earned the honorable calling to serve in the Imperial Guard.

[8 Пехотинец]
Name=Infantryman
Descript=The Infantryman, armed with an axe and a shield, is the starting foundation of any army.

[9 Оруженосец]
Name=Squire
Descript=A Squire learns the art of war from a knight. A shield and a sword - that is all a squire needs for victory.

[10 Воин-пилигрим]
Name=Pilgrim Warrior
Descript=The Pilgrim Warrior is an exemplar of valor and courage. He wanders the world in search of an opportunity for martial feat.

[11 Паладин]
Name=Paladin
Descript=The Paladin is a knight consecrated by God, chosen to serve and protect the faith.

[12 Мечник]
Name=Swordsman
Descript=A Squire who has completed training under a knight and strives to gain further experience while serving in the army.

[13 Мастер меча]
Name=Sword Master
Descript=The Sword Master wields his weapon with virtuosity, ready to parry any enemy strike with unthinkable speed.

[14 Кирасир]
Name=Cuirassier
Descript=The Cuirassier is an elite warrior who has chosen a massive two-handed sword as his favorite weapon.

[15 Рыцарь]
Name=Knight
Descript=A participant in many cruel battles, the Knight possesses superb combat experience.

[16 Дубинщик]
Name=Clubman
Descript=Instead of a sword, the Clubman prefers a mace, which delivers heavy blows even through an enemy's armor.

[17 Воин с булавой]
Name=Mace Warrior
Descript=Wielding the mace with virtuosity, this warrior does not fear fighting without a shield, inflicting greater damage upon the enemy.

[18 Молотоборец]
Name=Hammer Fighter
Descript=Having reached the heights of combat mastery, the Hammer Fighter takes up a massive spiked hammer.

[19 Охотник]
Name=Hunter
Descript=Any Hunter skilled in archery can enlist in military service.

[20 Стрелок]
Name=Sharpshooter
Descript=The Sharpshooter is a mercenary hunter who regularly trains at the shooting range.

[21 Лучник]
Name=Archer
Descript=A Sharpshooter who has participated in many successful battles receives a new uniform and the right to be called an Archer.

[22 Егерь]
Name=Ranger
Descript=The Ranger is an experienced and talented archer, possessing the best equipment and a named bow.

[23 Арбалетчик]
Name=Crossbowman
Descript=The Crossbowman is entrusted with powerful weaponry. His weakness lies in the fact that reloading the crossbow takes much time.

[24 Бомбардир]
Name=Bombardier
Descript=Commanding the most powerful ranged weapon, the Bombardier inflicts incredible damage upon the enemy.

[25 Пушкарь]
Name=Cannoneer
Descript=A Cannoneer without a cannon is no Cannoneer. And the cannon is the queen of the battlefield. Together with the cannon, the Cannoneer decides the outcome of the battle.

[26 Послушница]
Name=Novice Nun
Descript=A girl entering the monastery to perform service to God attains the gift of healing.

[27 Монашка]
Name=Nun
Descript=The Nun is familiar with all the mysteries of the faith, which allows her to bless warriors and heal them.

[28 Волшебница]
Name=Sorceress
Descript=The Sorceress knows how to command the elements. Besides healing, her magic bestows incredible swiftness.

[29 Святая]
Name=Saint
Descript=The Saint is a great healer and physician. She will tear you from the clutches of death even when others retreat.

[30 Паломник]
Name=Pilgrim
Descript=The Pilgrim spends his days wandering. Having steeled his mind and faith, he drives away evil with prayer.

[31 Монах]
Name=Monk
Descript=In a moment of danger, the Monk takes up a flail and, in the name of the Lord, defends his land, sparing no curses upon the enemy.

[32 Священник]
Name=Priest
Descript=The Priest zealously watches over the purity of the faith, calling down the Lord's wrath upon heretics and criminals.

[33 Епископ]
Name=Bishop
Descript=Blessed by God, the Bishop expels any manifestations of evil, saving the souls of the living and restoring peace to the dead.

[34 Боевой монах]
Name=Battle Monk
Descript=The militant Monk has taken the path of war against heresy and the undead. His prayer is a battle flail, and his cell is an iron panoply.

[35 Церковный страж]
Name=Church Guard
Descript=The Church Guard protects holy places, and anyone who encroaches upon them with evil will shall know the Lord's punishment.

[36 Инквизитор]
Name=Inquisitor
Descript=Following the precepts of the Saints, the Inquisitor seeks and destroys the unfaithful, carrying the Lord's wrath upon his sword.

[37 Знахарь]
Name=Healer
Descript=The Healer is an aspiring sorcerer, capable of increasing the reaction speed of any warrior, but only for a short time.

[38 Волшебник]
Name=Wizard
Descript=The Wizard is capable of touching any warrior in battle with magic, aiding friends and hindering the enemy.

[39 Архимаг]
Name=Archmage
Descript=The Archmage calls upon the mighty forces of the universe, inspiring heroes to great deeds.

[40 Кавалерист]
Name=Cavalryman
Descript=A swift rider, whose attack is impossible to withstand, is the foundation of any mounted force.

[41 Конный Сержант]
Name=Mounted Sergeant
Descript=The Mounted Sergeant charges into battle following the Mounted Knight, driving deep into the enemy ranks.

[42 Конный Рыцарь]
Name=Mounted Knight
Descript=The Mounted Knight is a universal striking force for any modern and well-equipped army.

[43 Мертвяк]
Name=Deadman
Descript=A Deadman is a soulless body raised from the grave by the powers of necromancers.

[44 Мертвый воин]
Name=Dead warrior
Descript=Necromancers endow the body of an unburied warrior with deadly will, forcing it to serve their evil purposes.

[45 Мертвый вождь]
Name=Dead chieftain
Descript=The body of an ancient Dead chieftain, imprisoned in an abandoned crypt, has become a vessel for evil demons.

[46 Рыцарь смерти]
Name=Death Knight
Descript=A mighty warrior of the past, who succumbed to demonic charms, became a monstrous puppet of evil forces after death.

[47 Упырь]
Name=Ghoul
Descript=A maddened Beggar, possessed by demons, devours fresh corpses, trying to satiate his hunger.

[48 Вампир]
Name=Vampire
Descript=Having sold his life and soul to dark forces, the Vampire loses his human essence, drawing strength from the blood of the living.

[49 Носферату]
Name=Nosferatu
Descript=The Nosferatu spent centuries studying mystical demonology, becoming the strongest of vampires.

[50 Вампирша]
Name=Vampress
Descript=A Sorceress, having succumbed to the temptation of eternal life, strikes a pact with vampires, helping them hunt for living prey.

[51 Тень]
Name=Shadow
Descript=An incorporeal Shadow wandering in the darkness, breathing a grave chill that freezes the blood in one's veins.

[52 Дух]
Name=Spirit
Descript=An unquiet Spirit, causing numbness and dragging all into the dark depths of death.

[53 Призрак]
Name=Ghost
Descript=A terrifying Messenger of Death from the underworld, paralyzing with a gaze and taking the life of anyone who enters combat with him.

[54 Еретик]
Name=Heretic
Descript=Having rejected God, the Heretic gives himself to the forbidden fruits of dark knowledge, dreaming of power and wealth.

[55 Некролит]
Name=Necrolith
Descript=A Necrolith, beginning to learn the mysteries of the dark side, experiments with death, destroying life around him through his rituals.

[56 Лич]
Name=Lich
Descript=Having attained the highest knowledge, the Necromancer is reborn, dying in his flesh and gaining an even more terrible power.

[57 Ересиарх]
Name=Heresiarch
Descript=The Heresiarch has thoroughly studied the laws of the underworld, and now rules over dead flesh, breathing strength into it.

[58 Дьяволист]
Name=Devilist
Descript=The Devilist promised to serve demons eternally, receiving in return the power to gather dead armies around him.

[59 Нищий]
Name=Beggar
Descript=An ordinary Beggar, who wanders the roads and begs for alms.

[60 Крестьянин]
Name=Peasant
Descript=The Peasant is a laborer of the earth. He toils in the field, and by doing so, feeds the noble people - the feudal lords.

[61 Староста]
Name=Elder
Descript=The most worthy of the peasants are chosen for the role of Elder. Usually, they spend their time in the tavern.

[62 Бандит]
Name=Bandit
Descript=A peasant man, having found an old sword, stepped onto the high road to rummage through others' pockets.

[63 Атаманша]
Name=Atamansha
Descript=A once decent sorceress, unable to complete her training. Preferring easy bread, she engages in brigandage.

[64 Убийца]
Name=Assassin
Descript=An employee of the assassins' guild, who became famous for his dark deeds.

[65 Грабитель]
Name=Robber
Descript=Ordinary robbers make do with a simple spear. This is enough for them to frighten and rob a passerby.

[66 Разбойник]
Name=Brigand
Descript=If gold should suddenly weigh down your pocket, a brigand will always help you in this trouble.

[67 Разбойница]
Name=Brigandess
Descript=In the company of her comrades, a brigandess is always ready to relieve you of the weight of your purse.

[68 Мародер]
Name=Marauder
Descript=A Marauder is not burdened by conventions, and if something lies somewhere, he will take it for himself, regardless of the circumstances.

[69 Лжерыцарь]
Name=False Knight
Descript=False Knights have broken knightly codes and laws, for which they were stripped of noble rights and landed estates.

[70 Лорд изменник]
Name=Traitor Lord
Descript=An outlawed feudal lord, who broke his oath to his suzerain for selfish purposes.

[71 Святой брат]
Name=Holy Brother
Descript=A village priest, who cares about bringing bandits back to the true path, and accompanies them everywhere.

[72 Король]
Name=King
Descript=A great and wise ruler, a great warrior in the past. By his word, wars began and peace treaties were concluded.

[73 Принцесса]
Name=Princess
Descript=A beautiful and spoiled creature. Can do nothing, but wants very much.

[74 Идальго]
Name=Hidalgo
Descript=A noble nobleman, too refined to don a pile of iron and go performing feats.

[75 Купец]
Name=Merchant
Descript=A Merchant - knows where, what, and for how much to sell or buy. He is indispensable when solving financial problems.

[76 Аббат]
Name=Abbot
Descript=A devoted servant of the monastery, the Abbot cares for the enlightenment and prosperity of his parishioners.

[77 Проклятый рыцарь]
Name=Cursed Knight
Descript=A Knight who has succumbed to the temptations of evil forces, committing evil and lawlessness for the sake of accumulating wealth and strengthening his power.

[78 Горожанка]
Name=Townswoman
Descript=A resident of a large city. A peasant in the past, now a street vendor.

[79 Дворянская дочь]
Name=Noble daughter
Descript=A headstrong noble daughter, who will always do everything contrary to her parents' advice.

[80 Лесной бандит]
Name=Forest Bandit
Descript=A Forest Bandit prefers to work in the woods, where no one will notice from where his arrow flew.

[81 Начальник стражи]
Name=Captain of the Guard
Descript=The Captain of the Guard knows all the nooks and crannies of his castle, and makes use of them - both during a siege and in times of peace.

[82 Викинг]
Name=Viking
Descript=Protected by faith in pagan gods, a Viking participates in raids on civilized lands.

[83 Колдунья]
Name=Sorceress
Descript=Having studied the mysteries of anathema, the sorceress becomes indispensable if one needs to weaken and strike an enemy.

[84 Ведьма]
Name=Witch
Descript=Knowing all the subtleties of curses and battle magic, the witch is a dangerous opponent on the battlefield.

[85 Культист]
Name=Cultist
Descript=A follower of a secret cult, who has dedicated his life to fighting the infidels.

[86 Снайпер]
Name=Sniper
Descript=A Sniper is the most accurate archer in the army. To protect him in battle, he is equipped with leather armor and a helmet.

[87 Асасин]
Name=Assassin
Descript=Specially trained assassin sharpshooters often decide the outcome of a battle with the help of their weapons.

[88 Злодей]
Name=Villain
Descript=True villains, driven by a thirst to do evil, rush into battle like true berserkers.

[89 Атаман]
Name=Ataman
Descript=Any self-respecting Ataman loves to embellish his costume, so as not to lose face before the gang.

[90 Дворянская дочь]
Name=Noble daughter
Descript=An exalted and somewhat naive creature, waiting for a beautiful knight on a white horse.

[91 Дворянская дочь]
Name=Noble daughter
Descript=A beautiful lady, who knows her worth. Not a single broken heart is on her account...

[92 Яростный дух]
Name=Furious Spirit
Descript=A Furious Spirit, with a ghostly sword, has returned to this world to seek vengeance.

[93 Чародейка]
Name=Sorceress
Descript=Through years of magical practice, I have grown used to enemies falling in heaps at the snap of my fingers. If enemies are suddenly, by chance, unaware, I strike them across the ears with a switch.

[94 Лучница]
Name=Archer
Descript=A warrior maiden, preferring hunting and a bow in her hands to needlework and embroidery. Thanks to innate agility, she shoots fast, but alas, not very strongly.

[95 Браконьер]
Name=Poacher
Descript=Poachers are experienced hunters who are not afraid to encounter either wild beasts or the feudal lords' Rangers in the forest.

[96 Вурдалак]
Name=Ghoul
Descript=Having sold his soul to the forces of evil and death, a Ghoul turns into a monster, hunting the living in a blind thirst for blood.

[97 Некромант]
Name=Necromancer
Descript=A Necromancer has learned the mysteries of death and the laws of the spirit world. Through his rituals, he suppresses life around him.

[98 Нищенка]
Name=Beggar woman
Descript=An ordinary Beggar woman. Such can often be seen near the church or at the market.

[99 Архилич]
Name=Archlich
Descript=Having learned all the mysteries of life and death, a dead Necromancer attains unseen powers and capabilities.

[100 Посланик Смерти]
Name=Messenger of Death
Descript=A secret Messenger of Death, subordinate to the forces of the dead, serves Necromancers and Liches in their terrible deeds.

[101 Посланник Смерти]
Name=Messenger of Death
Descript=A secret Messenger of Death, subordinate to the forces of the dead, serves Necromancers and Liches in their terrible deeds.

[102 Чумной доктор]
Name=Plague Doctor
Descript=Plague Doctor - a healer of plague, and of other diseases. He knows how to support the sick in their hour of need, and to bring relief from suffering.
