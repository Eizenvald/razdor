[166 Фамильное кольцо]
Name=Family Ring
Descript=This ring was passed down to you from your father. He, in turn, received it from your grandfather, who was gifted it by His Majesty for his exploits in the glory of the state and the crown.

[167 Фамильная реликвия]
Name=Family Relic
Descript=This cross was passed down to you from your mother. And she, in turn, received it from your grandfather, who was gifted it by the Archbishop himself for fighting heresy and serving the Lord.
