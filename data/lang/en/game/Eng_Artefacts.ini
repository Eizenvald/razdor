; English texts for Razdor, made by razdor-translate from the Russian file.

[1 Меч "Победитель"]
Name=Sword "Winner"
Descript=This sword, made of shining celestial metal, with a simple but effective guard, will grant its wielder strength and endurance.

[2 Меч "Защитник"]
Name=Sword "Defender"
Descript=With this long sword, crafted from rare Damascus steel, it is much more convenient to defend oneself in battle than with an ordinary sword.

[3 Меч "Поющих черепов"]
Name=Sword "of Singing Skulls"
Descript=This sword with a golden guard, adorned with intricate patterns, grants its owner unseen agility.

[4 Меч "Кровопийца"]
Name=Sword "Blooddrinker"
Descript=This sword of strange purple metal drains the life from enemies and provides secret power.

[5 Меч Викинга]
Name=Viking Sword
Descript=An old and sturdy sword, made by Vikings a couple of centuries ago. It has been well preserved and can still serve well in martial matters.

[6 Меч Рыцаря]
Name=Knight Sword
Descript=An excellent Knight sword. No excesses and superb quality. This weapon is intended for battle, not for hanging on a wall.

[7 Меч "Грома"]
Name=Sword "Thunder"
Descript=An excellent sword, made from an alloy whose secret has been carefully guarded by royal smiths for over three centuries. Rumors say it can cleave stone.

[8 Меч "Храбрости"]
Name=Sword "Bravery"
Descript=A decent sword with a simple but beautiful guard. It grants its owner bravery and courage.

[9 Меч "Осторожности"]
Name=Sword "Caution"
Descript=This sword, plain to the eye, makes its owner incredibly cautious and protects against thoughtless, sudden movements.

[10 Меч "Берсеркер"]
Name=Sword "Berserker"
Descript=This sword grants its owner battle madness, but strips away all defense.

[11 Кинжал "Удачи"]
Name=Dagger "Luck"
Descript=This simple dagger, despite its unseemly appearance, will be very helpful to those who do not know how to fight.

[12 Кинжал "Жнец"]
Name=Dagger "Reaper"
Descript=This ritual dagger will aid you in your struggle against evil and protect you from the evil eye.

[13 Клинок "Император"]
Name=Blade "Emperor"
Descript=This rare blade is valued because, as chroniclers claim, it once belonged to a great Emperor.

[14 Кинжал "Жало"]
Name=Dagger "Sting"
Descript=This dagger, made of meteoric iron, will allow its wielder to easily strike an opponent, piercing any armor.

[15 Кинжал "Ловкач"]
Name=Dagger "Agile"
Descript=This dagger, thanks to the features of its hilt and blade, increases the agility and reaction of its wielder.

[16 Кинжал воина]
Name=Warrior's Dagger
Descript=An excellent combat knife. Of course, it is far from a true sword, but if you are small of stature, this weapon is just for you.

[17 Секира "Кровопийца"]
Name=Axe "Blooddrinker"
Descript=This two-handed greataxe with a double-edged blade can cleave a silk kerchief in mid-air.

[18 Секира "Коготь"]
Name=Axe "Claw"
Descript=This axe with a bluish, curved blade will protect you in battle from hostile sorcery, thanks to a powerful spell.

[19 Топор Конунга]
Name=Konung's Axe
Descript=This axe once belonged to a glorious northern Konung. Although it has turned green with age, it will still suffice to smash a couple of heads.

[20 Топор Гвардейца]
Name=Guardsman's Axe
Descript=Such axes arm the Imperial Guard and the Royal Guard in the capital itself.

[21 Топор "Проклятие"]
Name=Axe "Curse"
Descript=This is the weapon of the soldiers of the "Cursed Legion", who remained faithful to their oath even when betrayed by their liege. Rumors say that for whoever takes this weapon in hand, wounds are no threat.

[22 Штурмовой Топор-Молот]
Name=Assault War-Hammer
Descript=An excellent battle axe combined with a hammer, capable of crushing armor and dealing damage even to excellently protected fighters.

[23 Ритуальный топор]
Name=Ritual Axe
Descript=Similar axes were used in ancient times by the priests of blood cults. Perhaps this is one such Ritual Axe.

[24 Арбалет "Черный Стрелок"]
Name=Crossbow "Black Sharpshooter"
Descript=This is an ancient legendary weapon. On its stock, one can see 11 notches - that is how many noble lords have been killed with it over the centuries since its making.

[25 Арбалет "Охотник"]
Name=Crossbow "Hunter"
Descript=A rapid-fire crossbow, designed for hunting predators, such as wolves or foxes.

[26 Арбалет "Сияние"]
Name=Crossbow "Radiance"
Descript=This crossbow was made by an ancient sorcerer. Thanks to its magical aura, the arrows fired from it can strike any target.

[27 Лук молнии]
Name=Lightning Bow
Descript=This bow was made long ago, when armor was rare and expensive. It is convenient for rapid shooting, but deals damage only to defenseless targets...

[28 Костяной лук]
Name=Bone Bow
Descript=This bow, made from dragon bones, possesses a magical property - it always ensures high accuracy for its owner.

[29 Лук снайпера]
Name=Sniper's Bow
Descript=A high-quality bow that has earned the respect of marksman Sharpshooters. Thanks to its fine craftsmanship, the arrows fired from it fly more accurately toward the target.

[30 Двойной лук]
Name=Double Bow
Descript=Crafted by a cunning master, this bow allows for firing two arrows at once, though with less accuracy than a simple bow.

[31 Огненные Стрелы]
Name=Fire Arrows
Descript=These arrows, unpromising at first glance, are actually capable of piercing through any armor.

[32 Перчатка лучника]
Name=Archer's Glove
Descript=A specially crafted Archer's Glove, allowing for a more comfortable grip on the arrow and faster shooting.

[33 Походный колчан]
Name=Traveling Quiver
Descript=A special Traveling Quiver, allowing for the storage and transport of arrows; it is convenient for any archer and will help perform more shots at the start of an attack.

[34 Латы крестоносца]
Name=Crusader's Plate
Descript=Crusader's Plate, despite some pomposity and gilding, will protect in battle not only from blows, but also from curses and hostile spells.

[35 Рыцарские латы]
Name=Knightly Plate
Descript=Excellent Knightly Plate in wonderful condition. Though it may look simple, it provides its owner with maximum protection in battle.

[36 Пластинчатый доспех]
Name=Plated Armor
Descript=Excellent plated armor is not as good as knightly plate, but significantly more reliable than simple chainmail.

[37 Колонтарь]
Name=Cuirass
Descript=Unlike simple Chainmail, metal plates sewn into the Cuirass provide better protection against arrows and piercing strikes.

[38 Кольчуга]
Name=Chainmail
Descript=Ordinary steel Chainmail made of thick, strong rings. It can provide decent protection against both swords and arrows.

[39 Кожаный панцирь]
Name=Leather Breastplate
Descript=A Leather Breastplate with sewn-in steel plates is almost as comfortable as simple Leather Armor, but protects its owner much better.

[40 Кожаный доспех]
Name=Leather Armor
Descript=Simple, but well-made Leather Armor. It provides its owner with at least some protection in battle.

[41 Парадный кожак]
Name=Ceremonial Kaftan
Descript=This ceremonial Leather Armor serves an aesthetic rather than a practical purpose.

[42 Кожаные наручи]
Name=Leather Bracers
Descript=Simple Leather Bracers. For lightly armed warriors, they will be quite useful, but a Knight will look upon them with a smirk.

[43 Шлем крестоносца]
Name=Crusader's Helmet
Descript=In such helmets, the true warriors of faith - the Crusaders - won back the Lord's tomb from the infidels.

[44 Шлем Героя]
Name=Hero's Helmet
Descript=A magnificent Knight's helmet, made in the finest royal armories. Only a true hero shall be granted the high honor of wearing this helmet.

[45 Шлем Черного легиона]
Name=Black Legion Helmet
Descript=Such helmets were worn by the elite fighters of the striking "Black Legion". Our church believes they are enchanted with dark spells.

[46 Шлем Воина Света]
Name=Warrior of Light Helmet
Descript=This is the official battle helmet of the Order of the Warriors of Light - such helmets are consecrated by the royal archimandrite himself and blessed to fight the forces of evil.

[47 Шлем отваги]
Name=Helmet of Valor
Descript=This simple helmet will look great both on the head of a brave warrior and as a decoration for the fireplace hall in a castle.

[48 Шлем Викинга]
Name=Viking Helmet
Descript=This simple helmet, made in ancient times by vikings, will help those brave souls who have no helmet at all.

[49 Корона Императора]
Name=Emperor's Crown
Descript=This beautiful crown embodies the symbol of the Emperor's boundless power over the entire world.

[50 Щит Викинга]
Name=Viking Shield
Descript=A sturdy viking shield with a black spiral. It will serve well in battle and help those who have no shield at all. Rumor has it, the spiral on the shield hypnotizes enemies.

[51 Круглый щит]
Name=Round Shield
Descript=An old round shield. It will help a defenseless warrior protect himself from arrows, but in close combat, it is of no use.

[52 Ростовой щит]
Name=Tower Shield
Descript=A large crusader tower shield. One cannot run quickly with it, but it will protect well from blows, and the embedded spells will protect against hostile magic.

[53 Щит "Грифона"]
Name="Griffin" Shield
Descript=A triangular shield, which knights of the Order of the Black Griffin usually carry. It is convenient for both defense and striking at an opponent.

[54 Щит "Вепря"]
Name="Boar" Shield
Descript=A heraldic shield of the Boar knightly order. It is beautiful, but somewhat inconvenient for serious combat.

[55 Строевой щит]
Name=Pavise Shield
Descript=A convenient hexagonal shield. With such a shield, both a knight and a militiaman will go boldly into battle. Usually, units of spearmen carry such shields.

[56 Щит "Крылатый Лев"]
Name="Winged Lion" Shield
Descript=This sturdy shield was crafted by masters of the Order of the Winged Lion. Being incredibly light, it allows one to deftly dodge enemy blows.

[57 Щит Рыцаря Смерти]
Name=Death Knight Shield
Descript=This magnificent shield once belonged to a knight who sold his soul to demons. Anyone who takes this shield will be securely protected from weapons, but defenseless against death...

[58 Медное Колечко]
Name=Copper Ring
Descript=This plain copper ring has one significant advantage - by selling it, one can buy some beer.

[59 Серебряное колечко]
Name=Silver Ring
Descript=This silver ring possesses healing properties and mends wounds. Furthermore, it will serve as a good protection against evil and undead.

[60 Кольцо богача]
Name=Rich Man's Ring
Descript=This ring can always be sold for a good profit - for there will always be a rich fool who covets the shine of gold.

[61 Кольцо варлока]
Name=Warlock Ring
Descript=This ring once belonged to a great sorcerer - in it, he kept a portion of his sorcerous power.

[62 Кольцо вампира]
Name=Vampire Ring
Descript=This plain ring made of burgundy metal possesses the ability to suck the life out of others.

[63 Кольцо Воина]
Name=Warrior Ring
Descript=This ring was created by a powerful mage to improve his martial abilities.

[64 Кольцо "Змеиный глаз"]
Name="Serpent Eye" Ring
Descript=A dark spell placed within this ring absorbs the life of others, without distinction - whether it be foe or friend.

[65 Кольцо "Глаз дракона"]
Name="Dragon Eye" Ring
Descript=A beautiful ring with a transparent red stone. It possesses the ability to heal wounds and strengthens the owner's health.

[66 Кольцо "Орлиный глаз"]
Name="Eagle Eye" Ring
Descript=Thanks to a special spell, this ring increases the accuracy of your strikes and the precision of your shooting.

[67 Кольцо "Смерти"]
Name="Death" Ring
Descript=This ring with a silver seal affects the human body in a strange way, simultaneously taking life and returning it.

[68 Жезл Смерти]
Name=Death Scepter
Descript=This large bone was used by an ancient sorcerer in his necromantic rituals, after which it was transformed into a magic scepter.

[69 Посох колдуна]
Name=Sorcerer Staff
Descript=A wooden staff made of twisted wood. Spells specially embedded within it can protect a sorcerer from swords and arrows.

[70 Посох ведьмы]
Name=Witch Staff
Descript=A wooden staff with hanging fox tails and pheasant feathers. Judging by the runes inscribed upon it, it once belonged to a witch.

[71 Жезл молний]
Name=Lightning Scepter
Descript=A bronze scepter with a gold-decorated tip. It enhances the magical abilities of all sorcerers and mages specializing in elemental magic.

[72 Святая икона]
Name=Saint Icon
Descript=This saint icon will help you turn your gaze to God in a difficult moment and will strengthen your prayers.

[73 Святое писание]
Name=Holy Scripture
Descript=The Bible is a holy scripture, where examples from the lives of saints, parables, and prayers are collected, as well as ways to recognize evil. It is the only book whose reading will save you in a difficult moment!

[74 Святой крестик]
Name=Holy Cross
Descript=The Holy Cross, a symbol of faith, brings clarity of thought to its owner and aids in protection from evil.

[75 Святые мощи]
Name=Holy Relics
Descript=The Holy Relics of a righteous martyr contained in this pouch grant strength and health to any who are weak in spirit and body.

[76 Святая молитва]
Name=Holy Prayer
Descript=A true prayer - for the salvation of a servant of God from the temptations of the devil - so as not to succumb to the evil charms that destroy the soul.

[77 Святая вода]
Name=Holy Water
Descript=Holy Water, consecrated by the venerable Bishop himself. This is the best means for fighting the loathsome manifestations of evil.

[78 Амулет "Vitalis"]
Name="Vitalis" Amulet
Descript=The sorcerous "Vitalis" Amulet multiplies your life forces many times over.

[79 Амулет "Armatus"]
Name="Armatus" Amulet
Descript=The sorcerous "Armatus" Amulet gives you protection from harmful physical and magical effects.

[80 Амулет "Celeritas"]
Name="Celeritas" Amulet
Descript=The sorcerous "Celeritas" Amulet gives you agility and dexterity unavailable to a simple warrior.

[81 Амулет "Robus"]
Name="Robus" Amulet
Descript=The sorcerous "Robus" Amulet makes you resilient and capable of self-healing.

[82 Амулет "Occultum"]
Name="Occultum" Amulet
Descript=The sorcerous "Occultum" Amulet opens paths to the astral for you, strengthening your magical essence.

[83 Знак "Рыцаря"]
Name=Sign of the "Knight"
Descript=He who possesses this sign shall grasp the meaning of knighthood and act as a true Knight.

[84 Символ ордена Храма]
Name=Symbol of the Order of the Temple
Descript=The Symbol of the Order of the Temple, bestowed by the Grand Master himself, initiates the owner into the mysteries of the order's deeds.

[85 Святое вино]
Name=Holy wine
Descript=The Holy wine contained in this vial bestows grace upon the owner, which undoubtedly aids in protection from the forces of evil.

[86 Знак Архимага]
Name=Sign of the Archmage
Descript=This magical medallion is the distinguishing mark of great Archmages.

[87 Кровавый крест]
Name=Blood cross
Descript=A silver cross with red stones. Rumors say the stones turned red from the innocent blood of a saint. One way or another, it possesses miraculous powers...

[88 Крест синего пламени]
Name=Cross of blue flame
Descript=This sacred relic has survived from the days of wrath, when holy Inquisitors burned out the nests of heresy sown by the devil in human souls.

[89 Некрономикон]
Name=Necronomicon
Descript="Necronomicon" - a devilish book written by the mad Arab Al-Hazred hundreds of years ago. The incantations described within open gates to the abysses of the world of the dead...

[90 Знак хаоса]
Name=Sign of chaos
Descript=This amulet, plain at first glance, creates chaos in the mind of its owner, changing their essence in a strange and unpredictable manner.

[91 Часы времени]
Name=Clock of time
Descript=These hourglasses slow the flow of time, making you faster than those around you and less subject to hostile magic.

[92 Ритуальный бокал]
Name=Ritual goblet
Descript=An ornately decorated ritual goblet. The aura of sanctity surrounding it will grant you wisdom and understanding of the essence of things.

[93 Ритуальный кубок]
Name=Ritual chalice
Descript=An ornately decorated ritual chalice. The aura of sanctity surrounding it will protect you from dangers and mend your health.

[94 Иконостас]
Name=Iconostasis
Descript=A sacred Iconostasis can always be found in the altar of any church. It will protect you from any manifestations of evil, but its weight will prevent active movement.

[95 Зелье скорости]
Name=Potion of speed
Descript=A sorcerous mixture. If you risk drinking it, your body will become weak and sickly, but your reflexes will increase to a magnitude unattainable by a mere mortal.

[96 Черное снадобье]
Name=Black concoction
Descript=A mysterious black concoction, capable of bringing anyone back to life. Theologians still do not agree whether it is divine or devilish.

[97 Кровь для Вампира]
Name=Blood for the Vampire
Descript=Human blood, which through abominable rituals has acquired terrible properties - if you risk drinking it, you shall gain vampiric abilities.

[98 Лечебная микстура]
Name=Healing mixture
Descript=The mixture from this vial is capable of curing you of the heaviest illness and strengthening shaken health, adding strength and vigor.

[99 Лечебное зелье]
Name=Healing potion
Descript=This healing potion strengthens your health and helps to heal wounds.

[100 Лечебная настойка]
Name=Healing tincture
Descript=This cheap healing tincture will always help you if you have been scratched while pushing through bushes, or started sneezing after falling into a puddle.

[101 Пивная кружка]
Name=Beer mug
Descript=If you are a lover of beer, then this mug will help you win any beer battle. However, perhaps it is not as simple as it seems...

[102 Поломанный меч]
Name=Broken sword
Descript=A broken sword from battle. Perhaps once it was a magnificent weapon. Now this shard is good for nothing.

[103 Веер]
Name=Fan
Descript=A beautiful fan made of peacock feathers. Perhaps it will help you in the heat, but in battle, it is of no use.

[104 Холщовый мешок]
Name=Canvas sack
Descript=An ordinary canvas sack with goods that peasants usually sell at the market.

[105 Маленький мешок]
Name=Small pouch
Descript=A small pouch with goods that peasants usually sell at the market.

[106 Бочонок с пивом]
Name=Barrel of beer
Descript=An ordinary barrel, from which beer is poured in taverns.

[107 Свиток с текстом]
Name=Scroll with text
Descript=An ancient scroll with text. Perhaps some especially important information is written there...

[108 Вилы]
Name=Pitchfork
Descript=Ordinary peasant pitchfork. It can be used to move hay, clear manure, and do other useful work.

[109 Рубин]
Name=Ruby
Descript=A beautiful faceted ruby. Any merchant will buy it for 750 gold.

[110 Изумруд]
Name=Emerald
Descript=A beautiful faceted emerald. Any merchant will buy it for 1250 gold.

[111 Алмаз]
Name=Diamond
Descript=A beautiful faceted diamond. Any merchant will buy it for 1750 gold.

[112 Меч "Защитник веры"]
Name=Sword "Defender of the Faith"
Descript=This sword, consecrated by prayers, is meant to serve for the protection of the faith from the offspring of darkness.

[113 Проклятые кости]
Name=Cursed bones
Descript=These cursed bones suck the strength and soul from whoever takes them.

[114 Микстура стойкости]
Name=Potion of fortitude
Descript=This mixture promotes the firmness of spirit and body, and protects against wounds.

[115 Настойка св.Георгия]
Name=St. George's tincture
Descript=This tincture helps the true defenders of the faith to fight heretics, filling their souls with the strength of fallen enemies.

[116 Книга заклинаний]
Name=Spellbook
Descript=An ancient spellbook, written hundreds of years ago by an unknown sorcerer. Who knows what secrets it holds.

[117 Орден Бани]
Name=Order of Banny
Descript=With this order, brave heroes are rewarded for the wonders of bravery they have shown in battle.

[118 Орден Анны]
Name=Order of Anna
Descript=With this order, brave heroes are rewarded for valor and courage in battles against the enemies of the kingdom.

[119 Орден Подвязки]
Name=Order of the Garter
Descript=With this order, brave heroes are rewarded for faithful service and loyalty to the king.

[120 Серебряный крест]
Name=Silver cross
Descript=This silver cross is intended to protect simple warriors from the forces of evil.

[121 Орден Императора]
Name=Order of the Emperor
Descript=With this order, brave heroes who have performed a feat in the name of the homeland and the king are rewarded.

[122 Сапфир]
Name=Sapphire
Descript=A beautiful faceted Sapphire. Any merchant will buy it for 1000 gold.

[123 Латная перчатка]
Name=Plate gauntlet
Descript=A sturdy plate gauntlet will help you in any battle.

[124 Кольцо "Глаз рыси"]
Name=Lynx Eye Ring
Descript=The magical spells embedded in this ring make the owner more resilient and agile.

[125 Кольцо "Глаз тигра"]
Name=Tiger Eye Ring
Descript=The magical spells embedded in this ring accelerate their owner, making them faster and more agile.

[126 Кольцо защиты]
Name=Ring of protection
Descript=This magic ring increases its owner's armor, making even a linen shirt as hard as stone.

[127 Посох архимага]
Name=Archmage staff
Descript=A special traveling Archmage staff, used to increase the sorcerous power of its owner and cast a special protective spell.

[128 Посох епископа]
Name=Bishop staff
Descript=The Bishop staff will grant health to any priest and reward him with patience, to strengthen his prayers.

[129 Крестовой жезл]
Name=Cross scepter
Descript=Such a scepter was often used in the times of the crusades, to bring the word of God to pagans and infidels.

[130 Драконий посох]
Name=Dragon staff
Descript=This staff of black wood was made by the masters of the magical order "Dragon's Heart", for the battle mages of the order.

[131 Святые четки]
Name=Holy beads
Descript=These holy rosary beads will help you when reciting prayers, to protect yourself from enemy arrows and spears.

[132 Охотничий лук]
Name=Hunter bow
Descript=A sturdy hunter bow. Of course, it is far from a combat bow, but not every hunter will find one like it.

[133 Тугой лук]
Name=Tight bow
Descript=This tight bow, made of ironwood, requires no small strength to use, but it shoots further and harder.

[134 Древняя карта]
Name=Ancient map
Descript=On this ancient map, one can discern a detailed map of the coast with building plans and several places marked with crosses.

[135 Пушнина]
Name=Fur
Descript=These valuable furs, obtained by hunters, can always be profitably sold in the city or at the market.

[136 Сомородок]
Name=Ingot
Descript=This gold ingot can surely be profitably sold in a jewelry shop, or to those who know their worth.

[137 Голубой камень]
Name=Blue stone
Descript=This bluish magic stone has a special price, but only for those who know its secrets. For others, it is not worth much.

[138 Синий камень]
Name=Blue stone
Descript=This blueish magic stone has a special price, but only for those who know its secrets. For others, it is not worth much.

[139 Зеленый камень]
Name=Green stone
Descript=This greenish magic stone has a special price, but only for those who know its secrets. For others, it is not worth much.

[140 Череп]
Name=Skull
Descript=This skull paralyzes the mind and strength of its owner, giving in exchange invulnerability and fearlessness.

[141 Книга лекаря]
Name=Healer's book
Descript=Such a book allows its owner to learn the secrets of healing and medicine.

[142 Когтистая кость]
Name=Clawed bone
Descript=This poisoned bone inflicts terrible, unhealing wounds.

[143 Кольцо "Лунный свет"]
Name="Moonlight" Ring
Descript=This ring, thanks to the healing enchantments embedded within it, increases your vitality and endurance.

[144 Кольцо скорости]
Name=Ring of Speed
Descript=This ring, thanks to the enchantment of haste cast upon it, allows you to move faster than ordinary people.

[145 Коса]
Name=Scythe
Descript=An ordinary peasant scythe. It can be used to mow grass or carried on one's shoulder to provide confidence.

[146 Молотилка]
Name=Flail
Descript=An ordinary peasant flail. It can be used to thresh grain until enlightenment is reached, and it may serve other purposes as well.

[147 Гербовая котта]
Name=Heraldic Cote
Descript=Only true knights wear such heraldic cotes, whose nobility has been granted by the king and confirmed by proper documents.

[148 Болотник белый]
Name=White Swamp Dweller
Descript=Healing herb used for the making of medicinal potions.

[149 Горький василек]
Name=Bitter Cornflower
Descript=Special magic herb, used for the making of magic potions and medicinal potions.

[150 Колючник красный]
Name=Red Thorn
Descript=Rare magic herb, used for the making of especially powerful magic potions and decoctions.

[151 Колдовская пыль]
Name=Sorcerous Dust
Descript=A small pouch of sorcerous dust, used during rituals.

[152 Хрустальный череп]
Name=Crystal Skull
Descript=Crystal Skull - a very powerful and rare magic artifact. Rumors say it can grant infinite power by taking one's soul.

[153 Череп силы]
Name=Skull of Power
Descript=This skull paralyzes your reaction and speed, endowing you with unseen strength and might.

[154 Королевская корона]
Name=Royal Crown
Descript=This crown is a symbol of royal authority and power.

[155 Большой мешок]
Name=Large Bag
Descript=A large bag tightly packed with goods that peasants usually sell at the market.

[156 Шлем Гвардейца]
Name=Guardsman Helmet
Descript=Such helmets are often used by guardsmen or those warriors who need good vision and decent protection.

[157 Шлем победителя]
Name=Winner's Helmet
Descript=Such helmets are often awarded to brave knights - winners of tournaments and brawls.

[158 Восточный шлем]
Name=Eastern Helmet
Descript=Such helmets are made and worn in the east. In our lands, they are a rarity, but are in demand due to their cheapness and quality.

[159 Шлем пехотинца]
Name=Infantryman Helmet
Descript=Such helmets are usually worn by experienced infantrymen. Despite its simple appearance, such a helmet protects its owner's head quite well.

[160 Щит "Единорога"]
Name="Unicorn" Shield
Descript=Heraldic shield of the knightly order of the Silver Unicorn. It possesses no special properties, but performs its function excellently.

