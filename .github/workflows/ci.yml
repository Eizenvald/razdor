# The quality gate: every push to main (and any pull request) is linted and tested.
# Tests that need the player's Discord Times install skip here (no RAZDOR_DT_DIR).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Libraries for sound (ALSA) and gamepads (udev)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - name: Rust (rust-toolchain.toml) with clippy
        run: rustup show active-toolchain && rustup component add clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: ci-${{ runner.os }}-

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --release

      - name: Guard hook cases
        run: sh .claude/hooks/test-guard.sh
